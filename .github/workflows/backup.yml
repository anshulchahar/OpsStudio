name: Encrypted database backup
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked database client dependencies
        run: npm ci --ignore-scripts
      - name: Install PostgreSQL 17 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --no-install-recommends -y postgresql-client-17
      - name: Create encrypted snapshot
        run: node scripts/backup.mjs
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          PGSSLROOTCERT: ${{ github.workspace }}/scripts/certs/supabase-ca.crt
          PG_BIN: /usr/lib/postgresql/17/bin
          BACKUP_DIRECTORY: work/backups
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: encrypted-database-${{ github.run_id }}
          path: work/backups/*.aesgcm*
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Record successful offsite upload
        run: node scripts/report-backup.mjs
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          MONITOR_URL: https://ops-studio.vercel.app
